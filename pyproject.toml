[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "weconnect-mcp"
dynamic = ["version"]
description = "MCP server for EVs (VW Group and 30+ other brands) via the Tibber Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-SA 4.0" }
dependencies = [
    "mcp==1.25.0",
    "fastmcp==2.14.1",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "platformdirs==4.5.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]

[project.scripts]
weconnect-mcp = "weconnect_mcp.cli.mcp_server_cli:main"
weconnect-tibber-login = "weconnect_mcp.cli.tibber_login_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Single source of truth for the package version: the nearest git tag
# (e.g. "v2.0.0" -> "2.0.0"; the "v" prefix is stripped automatically),
# so pyproject.toml/__init__.py/mcp_server.py never need a hand-edited
# version string that can drift out of sync with each other or with the
# actual git tag (see ARCHITECTURE.md's project history for the mess that
# caused: three different hardcoded version strings, none matching the
# other, plus a years-old "v1.0.0" tag on an entirely different codebase).
# fallback_version covers builds with no git history available at all
# (e.g. a source tarball, or -- see Dockerfile -- a build stage that
# doesn't COPY .git) so the build never hard-fails; update it by hand only
# if that ever needs to reflect a specific released version instead of a
# generic placeholder.
fallback_version = "0.0.0+unknown"
