[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weconnect-mcp"
version = "0.1.0"
description = "MCP server for EVs (VW Group and 30+ other brands) via the Tibber Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-SA 4.0" }
dependencies = [
    "mcp==1.25.0",
    "fastmcp==2.14.1",
    "pydantic==2.12.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]

[project.scripts]
weconnect-mcp = "weconnect_mcp.cli.mcp_server_cli:main"
weconnect-tibber-login = "weconnect_mcp.cli.tibber_login_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
