[pytest]
minversion = 6.0
addopts = -q --asyncio-mode=auto --capture=no -m "not real_api and not slow and not mcp_resources"
testpaths = tests
pythonpath = src

markers =
    real_api: marks tests that use real VW API (skipped by default, requires config.json)
    slow: marks tests as slow (real API calls)
    carconnectivity: marks tests that use real carconnectivity library
    mcp_resources: marks tests for MCP resources (skipped by default, resources not in use)
