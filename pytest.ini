[pytest]
minversion = 6.0
addopts = -q --asyncio-mode=auto --capture=no -m "not real_api and not slow"
testpaths = tests
pythonpath = src

markers =
    real_api: marks tests that use the real Tibber API (skipped by default, requires tibber_config.json)
    slow: marks tests as slow (real API calls)
