# docker-compose.yml – local testing of the containerised MCP server
#
# Usage:
#   cp .env.example .env        # fill in your real credentials
#   docker compose up --build
#
# Port strategy:
#   - Container runs internally on port 8080 (set via ENV PORT in Dockerfile)
#   - Host port 8089 is mapped to container port 8080 to avoid conflicts when
#     multiple MCP servers run locally (Railway always gets its own PORT injected)
# The server will be available at http://localhost:8089
# Test: curl http://localhost:8089/health

services:
  weconnect-mcp:
    build: .
    image: weconnect-mcp:local
    ports:
      - "8089:8080"   # host:container – access via http://localhost:8089 locally
    env_file:
      - .env          # create from .env.example – never commit this file!
    environment:
      PORT: "8080"    # internal container port
    volumes:
      # Persist the OAuth token store between restarts to avoid repeated logins
      - tokenstore:/tmp/ts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  tokenstore:
