# docker-compose.yml – local testing of the containerised MCP server
#
# Usage:
#   cp .env.example .env        # fill in your real credentials
#   docker compose up --build
#
# Set TIBBER_CLIENT_ID/TIBBER_CLIENT_SECRET in .env, and on first run also
# TIBBER_TOKEN_JSON -- paste in the contents of a token file produced by
# running `python -m weconnect_mcp.cli.tibber_login_cli` locally first (the
# interactive login itself cannot run inside this container). That seeds
# the tibber-tokens volume below once; every token refresh after that
# rewrites the volume directly, so TIBBER_TOKEN_JSON only matters for that
# first run -- safe to leave it in .env afterward, it's simply never read
# again once the volume has a file.
#
# Port strategy:
#   - Container runs internally on port 8080 (set via ENV PORT in Dockerfile)
#   - Host port 8089 is mapped to container port 8080 to avoid conflicts when
#     multiple MCP servers run locally (Railway always gets its own PORT injected)
# The server will be available at http://localhost:8089
# Test: curl http://localhost:8089/health

services:
  weconnect-mcp:
    build: .
    image: weconnect-mcp:local
    ports:
      - "8089:8080"   # host:container – access via http://localhost:8089 locally
    env_file:
      - .env          # create from .env.example – never commit this file!
    environment:
      PORT: "8080"    # internal container port
    volumes:
      # Persist the refresh token between restarts -- see the usage note
      # above for how it gets seeded on first run
      - tibber-tokens:/tmp/tibber-tokens
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  tibber-tokens:
